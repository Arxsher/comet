                <ul class="nav-links">

                    <li><a href="#team">Team</a></li>
                    <li>
                        <a href="#pages" class="pages-link">More <span class="arrow">▾</span></a>
                    </li>

                <button class="hamburger-menu" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>

            </div>
        </nav>


        <div class="cursor-glow"></div>
        <main class="hero">
            <div class="hero-content">
                <div class="testimonial">
                    <div class="avatars">
                        <img src="https://images.pexels.com/photos/614810/pexels-photo-614810.jpeg?auto=compress&cs=tinysrgb&w=100&h=100&dpr=2"

                        <img src="https://images.pexels.com/photos/1222271/pexels-photo-1222271.jpeg?auto=compress&cs=tinysrgb&w=100&h=100&dpr=2"

                        <img src="https://images.pexels.com/photos/1239291/pexels-photo-1239291.jpeg?auto=compress&cs=tinysrgb&w=100&h=100&dpr=2"
                            alt="User 3" />
                    </div>
                    <div class="rating">
                        <div class="stars">★★★★★</div>
                        <div class="rating-text">15+ rooms chatting now</div>
                    </div>
                </div>

                <h1 class="hero-title">
                    <span class="word word1">Speak</span>
                    <span class="word word2">your</span>
                    <span class="word word3">mind</span>
                    <br />
                    <span class="word word4 italic">live</span>
                    <br />
                    <span class="word word5">instantly.</span>
                    <br />
                </h1>

                <p class="hero-subtitle">
                    No waiting. No send button. Every letter you type shows up in real
                    time.<br />
                    Jump in, start typing, and feel the conversation flow.
                </p>

                <div class="hero-buttons">
                    <button class="btn-primary">Start Chatting</button>
                    <button class="btn-secondary">Learn More</button>
                </div>
            </div>
